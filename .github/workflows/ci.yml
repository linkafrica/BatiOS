name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batios
          POSTGRES_PASSWORD: batios
          POSTGRES_DB: batios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batios -d batios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm e2e:workflow
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env:
          BATIOS_TEST_DATABASE_URL: postgres://batios:batios@localhost:5432/batios_test
      - run: pnpm qa:harness
      - run: node compliance-mapper-stub.mjs
